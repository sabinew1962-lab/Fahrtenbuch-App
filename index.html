<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fahrtenbuch</title>
  <meta name="description" content="Fahrtenbuch mit Spracheingabe – alle Daten bleiben auf deinem Gerät.">
  <meta name="theme-color" content="#0f6e56">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="ansicht" class="ansicht" tabindex="-1"></main>

  <nav class="navigation" aria-label="Hauptnavigation">
    <button data-nav="start" aria-label="Start">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span>Start</span>
    </button>
    <button data-nav="fahrten" aria-label="Fahrten">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17h14M6 17l1.5-6h9L18 17M8 11l1-4h6l1 4"/><circle cx="8" cy="17.5" r="1.5"/><circle cx="16" cy="17.5" r="1.5"/></svg>
      <span>Fahrten</span>
    </button>
    <button data-nav="kosten" aria-label="Kosten">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
      <span>Kosten</span>
    </button>
    <button data-nav="auswertung" aria-label="Auswertung">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Auswertung</span>
    </button>
    <button data-nav="mehr" aria-label="Mehr">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
      <span>Mehr</span>
    </button>
  </nav>

  <dialog id="dialog" class="dialog"></dialog>
  <dialog id="dialog2" class="dialog dialog-klein"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="druck" class="druck"></div>

  <datalist id="dl-ziel"></datalist>
  <datalist id="dl-zweck"></datalist>
  <datalist id="dl-partner"></datalist>

  <script type="module" src="js/app.js"></script>
</body>
</html>
